name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk glow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glow-apk
          path: glow.apk
      - name: Update the V1.0 release with the new APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.0
          files: glow.apk
